spring.application.name=room-api

spring.datasource.url=jdbc:mysql://localhost:3306/roomdb
spring.datasource.username=roomapp
# class-only default; set DB_PASSWORD in the environment for anything real
spring.datasource.password=${DB_PASSWORD:roomapp1234}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:week10-dev-only-secret-change-me-0123456789}
app.jwt.ttl-minutes=30

# Week 11: browser pages allowed to call the API (comma-separated, never "*").
# The default is for class only; set CORS_ORIGINS in the environment.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
